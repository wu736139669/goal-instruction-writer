<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">Goal Instruction Writer</title>
<desc id="desc">Four colored checkpoints form an execution loop above the word GOAL and the phrase ONE OUTCOME.</desc>
<rect width="512" height="512" rx="84" fill="#101c31"/>
<rect x="28" y="28" width="456" height="456" rx="64" fill="none" stroke="#304b72" stroke-width="3"/>
<path d="M128 128H384V256H128Z" fill="none" stroke="#476b9d" stroke-width="12" stroke-linejoin="round"/>
<circle cx="128" cy="128" r="26" fill="#4ed1c5"/>
<circle cx="384" cy="128" r="26" fill="#917aff"/>
<circle cx="384" cy="256" r="26" fill="#ffbc68"/>
<circle cx="128" cy="256" r="26" fill="#ff7099"/>
<text x="256" y="380" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="100" fill="#f4f7ff">GOAL</text>
<text x="256" y="430" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" letter-spacing="3" fill="#a9bfdd">ONE OUTCOME</text>
</svg>
