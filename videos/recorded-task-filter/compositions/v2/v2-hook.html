<!doctype html><html lang="en"><head><meta charset="UTF-8"><title>Give your agent a finish line</title></head><body><template>
<div id="v2-hook-root"  data-composition-id="v2-hook" data-duration="6" data-width="1920" data-height="1080">
<style>#v2-hook-root{--bg:#111714;--fg:#f4f2e9;--muted:#bbc6b7;--rule:#3e4e41}#v2-hook-root *{box-sizing:border-box;margin:0}#v2-hook-root{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--fg);font-family:'IBM Plex Mono',monospace;}#v2-hook-root .brand{position:absolute;left:192px;top:84px;display:flex;align-items:center;gap:24px;font-size:26px;letter-spacing:1px;font-weight:700}#v2-hook-root .mark{border:2px solid currentColor;padding:9px 13px;font-size:30px;line-height:1}#v2-hook-root .edition{position:absolute;right:192px;top:96px;color:var(--muted);font-size:24px}#v2-hook-root .foot{position:absolute;left:192px;right:192px;bottom:78px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--rule);padding-top:22px;color:var(--muted);font-size:24px;line-height:1.3}#v2-hook-root .head{font-family:'League Gothic',sans-serif;font-weight:400;text-transform:uppercase;line-height:.98;letter-spacing:0}#v2-hook-root .rise{display:block}#v2-hook-root .linewrap{display:block;overflow:hidden}#v2-hook-root .accent{color:#e2f471}#v2-hook-root .kicker{font-size:25px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}#v2-hook-root .hook{position:absolute;left:192px;top:290px;font-size:184px;width:1120px}#v2-hook-root .sub{position:absolute;left:192px;top:768px;font-size:34px;line-height:1.5;width:1400px}#v2-hook-root .finish{position:absolute;left:1456px;top:320px;width:240px;height:390px}#v2-hook-root .checker{display:grid;grid-template-columns:repeat(4,48px);grid-template-rows:repeat(4,48px);border:1px solid #e2f471}#v2-hook-root .rail{position:absolute;left:0;top:192px;width:3px;height:86px;background:#e2f471;transform-origin:top center}#v2-hook-root .flag-label{position:absolute;left:0;top:310px;font-size:32px;color:#e2f471;white-space:nowrap}</style>
<div class="brand"><span class="mark">G&gt;</span><span>GOAL INSTRUCTION WRITER</span></div><div class="edition">01 / THE IDEA</div>

<h1 class="head hook"><span class="linewrap"><span class="rise">Give your agent</span></span><span class="linewrap"><span class="rise accent">a finish line.</span></span></h1>
<div class="finish" aria-label="Finish-line motif"><div class="checker" data-layout-ignore><span style="background:#e2f471"></span><span style="background:#111714"></span><span style="background:#e2f471"></span><span style="background:#111714"></span><span style="background:#111714"></span><span style="background:#e2f471"></span><span style="background:#111714"></span><span style="background:#e2f471"></span><span style="background:#e2f471"></span><span style="background:#111714"></span><span style="background:#e2f471"></span><span style="background:#111714"></span><span style="background:#111714"></span><span style="background:#e2f471"></span><span style="background:#111714"></span><span style="background:#e2f471"></span></div><div class="rail" data-layout-ignore></div><div class="flag-label">[ DONE ]</div></div>

<div class="foot"><span>A bounded workflow for coding agents</span><span>Recorded transcript replay</span></div>
<script>(function(){const root=document.getElementById('v2-hook-root');const tl=gsap.timeline({paused:true});const q=s=>root.querySelector(s);const qa=s=>Array.from(root.querySelectorAll(s));
qa('.rise').forEach((el,i)=>{gsap.set(el,{opacity:0,y:76});tl.set(el,{opacity:1},0.04+i*.14);tl.to(el,{y:0,duration:.23,ease:'power4.out'},0.04+i*.14);});

window.__timelines=window.__timelines||{};window.__timelines['v2-hook']=tl;})();</script>
</div></template></body></html>
