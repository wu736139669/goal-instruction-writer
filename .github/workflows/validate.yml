name: Validate skill

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check required skill files
        run: |
          test -f SKILL.md
          test -f agents/openai.yaml
          test -f LICENSE

      - name: Verify Skills CLI discovery
        run: npx --yes skills add . --list
