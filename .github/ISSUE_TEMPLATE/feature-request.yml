name: Feature request
description: Suggest a focused improvement backed by a real agent workflow.
title: "[idea] "
labels:
  - enhancement
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What task or failure mode should this support?
      placeholder: When an agent...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change, including its Goal, Loop, or Termination impact.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example
      description: Show a rough request, preview, or expected Goal.
    validations:
      required: false
